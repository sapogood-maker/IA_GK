services:
  postgres:
    image: postgres:16-alpine
    container_name: goalkeeper_ai_db
    environment:
      POSTGRES_USER: goalkeeper_user
      POSTGRES_PASSWORD: goalkeeper_pass
      POSTGRES_DB: goalkeeper_ai
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goalkeeper_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Fila de processamento (Redis Streams) - so infraestrutura e publisher
  # nesta sprint (ver app/core/queue.py). Nenhum consumer ainda; o AI
  # Worker sera quem consome, futuramente, num servico/repositorio proprio.
  redis:
    image: redis:7-alpine
    container_name: goalkeeper_ai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: goalkeeper_ai_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://goalkeeper_user:goalkeeper_pass@postgres:5432/goalkeeper_ai
      JWT_SECRET_KEY: dev-secret-key-change-in-production
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_MINUTES: 30
      REFRESH_TOKEN_EXPIRATION_DAYS: 7
      ENV: development
      REDIS_URL: redis://redis:6379/0
      # Trocar por um segredo forte proprio antes de usar em producao -
      # e a unica credencial que o futuro AI Worker vai usar (ver
      # app/core/worker_auth.py).
      WORKER_API_KEY: dev-worker-api-key-change-in-production
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    # Alembic e o unico mecanismo oficial de schema (ver SPRINT6_REPORT.md):
    # "alembic upgrade head" roda sempre antes do servidor subir, tanto para
    # um ambiente novo (aplica todas as migrations do zero) quanto para um
    # ambiente ja existente (aplica so as migrations pendentes).
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # AI Worker service - RESERVED for Sprint 2 (port 8002)
  # will be added in Sprint 2 with GPU support

volumes:
  postgres_data:
  redis_data:
